# Railway: Root Directory = `backend`. Nixpacks, sırları ARG/ENV ile gömüp Docker lint uyarısı üretiyordu;
# bu yüzden sırasız Dockerfile kullanılıyor (sırlar yalnızca çalışma zamanı Variables).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Başlatma: Dockerfile → ENTRYPOINT. Gömülü Celery: Variables → RUN_CELERY_IN_WEB=1 + REDIS_URL (veya CELERY_BROKER_URL).
# Ayrı Celery servisi gerekmez; worker + beat aynı konteynerde arka planda başlar.
# Railway UI’da Custom Start Command BOŞ olsun (doluysa ENTRYPOINT’i ezer).
# Railway şeması: dizide en fazla 1 eleman.
preDeployCommand = ["sh -c \"python manage.py migrate --noinput\""]
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "on_failure"
