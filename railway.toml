# Railway: set the service "Root Directory" to `backend` when deploying from monorepo,
# or configure this file path explicitly in Service → Settings → Config as Code.
[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
startCommand = "gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
preDeployCommand = ["python manage.py migrate --noinput"]
healthcheckPath = "/health/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
