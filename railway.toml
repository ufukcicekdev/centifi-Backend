# Railway: Root Directory = `backend`. Nixpacks, sırları ARG/ENV ile gömüp Docker lint uyarısı üretiyordu;
# bu yüzden sırasız Dockerfile kullanılıyor (sırlar yalnızca çalışma zamanı Variables).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Başlatma: Dockerfile → ENTRYPOINT [/docker-entrypoint.sh]. Railway UI’da Custom Start Command BOŞ olsun (doluysa CMD’yi ezer).
# Railway şeması: dizide en fazla 1 eleman.
preDeployCommand = ["sh -c \"python manage.py migrate --noinput\""]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
