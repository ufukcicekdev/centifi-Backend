<p style="margin:0 0 16px 0;color:#374151;">{{ greeting|escape }}</p>

<p style="margin:0 0 18px 0;color:#374151;line-height:1.55;">{{ body_intro|safe }}</p>

<!-- Feature list -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 22px 0;">
  {% for feature in features %}
  <tr>
    <td width="24" valign="top" style="padding:4px 8px 4px 0;color:#6C63FF;font-size:16px;line-height:1.3;">&#10003;</td>
    <td style="padding:4px 0;color:#374151;font-size:15px;line-height:1.4;">{{ feature|escape }}</td>
  </tr>
  {% endfor %}
</table>

<p style="margin:0 0 26px 0;color:#374151;line-height:1.55;">{{ body_cta|escape }}</p>

<!-- CTA button -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 28px 0;">
  <tr>
    <td style="border-radius:10px;background-color:#6C63FF;">
      <a href="{{ site_href|escape }}"
         style="display:inline-block;padding:13px 28px;font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:10px;letter-spacing:0.01em;">
        {{ cta_label|escape }}
      </a>
    </td>
  </tr>
</table>

<p style="margin:0;color:#9ca3af;font-size:13px;line-height:1.5;">{{ footer|escape }}</p>
