<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ document_title|escape }}</title>
  <!--[if mso]>
  <style type="text/css">
    table { border-collapse: collapse; }
    .centifi-card { border-radius: 0 !important; }
  </style>
  <![endif]-->
</head>
<body style="margin:0;padding:0;background-color:#e8ecf4;">
  <span style="display:none !important;visibility:hidden;mso-hide:all;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">
    {{ preheader|escape }}
  </span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#e8ecf4;">
    <tr>
      <td align="center" style="padding:28px 12px;">
        <table role="presentation" class="centifi-card" width="600" cellpadding="0" cellspacing="0" border="0"
          style="max-width:600px;width:100%;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="height:5px;line-height:5px;font-size:0;background-color:#6C63FF;">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:28px 28px 12px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  <td width="{{ logo_size }}" valign="top" style="padding-right:14px;">
                    {% include "partials/logo_cell.html" %}
                  </td>
                  <td valign="middle" style="font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;">
                    <div style="font-size:22px;font-weight:800;color:#111827;letter-spacing:-0.03em;line-height:1.2;">Centifi</div>
                    {% if header_subtitle %}
                    <div style="font-size:13px;color:#6b7280;margin-top:4px;line-height:1.35;">{{ header_subtitle|escape }}</div>
                    {% endif %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:4px 28px 32px 28px;font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;color:#374151;">
              {{ inner_html|safe }}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px;background-color:#f8fafc;border-top:1px solid #e5e7eb;">
              <p style="margin:0;font-family:Segoe UI,system-ui,-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;font-size:12px;color:#9ca3af;line-height:1.55;">
                Sent by <strong style="color:#6b7280;">Centifi</strong> · smart expense tracking<br />
                <a href="{{ site_href|escape }}" style="color:#6C63FF;text-decoration:none;font-weight:600;">{{ site_label|escape }}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
