<p style="margin:0 0 12px;font-size:15px;line-height:1.5;">
  New feedback <strong>#{{ pk }}</strong> from the website.
</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="width:100%;font-size:14px;line-height:1.5;margin:0 0 16px;">
  <tr><td style="padding:4px 0;color:#71717a;width:120px;">Name</td><td>{{ name }}</td></tr>
  <tr><td style="padding:4px 0;color:#71717a;">Email</td><td><a href="mailto:{{ email }}">{{ email }}</a></td></tr>
  <tr><td style="padding:4px 0;color:#71717a;">Category</td><td>{{ category }}</td></tr>
  <tr><td style="padding:4px 0;color:#71717a;">Language</td><td>{{ language }}</td></tr>
  <tr><td style="padding:4px 0;color:#71717a;">Source</td><td>{{ source }}</td></tr>
  <tr><td style="padding:4px 0;color:#71717a;">Received</td><td>{{ created_at }}</td></tr>
</table>
<p style="margin:0 0 8px;font-size:14px;font-weight:600;">Message</p>
<p style="margin:0;padding:12px 14px;background:#f4f4f5;border-radius:8px;white-space:pre-wrap;font-size:14px;line-height:1.55;">{{ message }}</p>
