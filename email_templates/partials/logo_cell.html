{% if logo_mode == "cid" %}
<img src="cid:{{ logo_cid_filename|escape }}" width="{{ logo_size }}" height="{{ logo_size }}" alt="Centifi"
  style="display:block;width:{{ logo_size }}px;height:{{ logo_size }}px;border:0;border-radius:12px;" />
{% else %}
<table role="presentation" cellpadding="0" cellspacing="0"
  style="width:{{ logo_size }}px;height:{{ logo_size }}px;border-radius:14px;background-color:#6C63FF;">
  <tr>
    <td align="center" valign="middle"
      style="font:bold 26px Segoe UI,Helvetica,Arial,sans-serif;color:#ffffff;line-height:1;">C</td>
  </tr>
</table>
{% endif %}
